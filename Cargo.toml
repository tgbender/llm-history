[workspace]
members = [
  "crates/core",
  "crates/store/history",
  "crates/store/engine",
  "crates/store/harnesses",
  "crates/models",
  "crates/search",
  "crates/app",
  "crates/cli",
  "crates/ingest",
  "crates/types",
]
resolver = "3"

[workspace.package]
version = "0.2.0-dev"
edition = "2024"
rust-version = "1.100"
license = "MIT"

[workspace.dependencies]
anyhow = "=1.0.104"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
comfy-table = { version = "=8.0.1", default-features = false }
clap = { version = "=4.6.7", features = ["derive", "env"] }
chrono = { version = "=0.4.45", features = ["serde"] }
chrono-tz = "=0.10.4"
iana-time-zone = "=0.1.65"
sha2 = "=0.11.1"
hex = "=0.4.3"
blake3 = "=1.8.7"
xxhash-rust = { version = "=0.8.19", features = ["xxh64"] }
zstd = "=0.14.3"
ruzstd = "=0.9.1"
fs2 = "=0.4.3"
reqwest = { version = "=0.12.28", default-features = false, features = [
  "blocking",
  "json",
  "rustls-tls",
] }
thiserror = "=2.0.21"
tempfile = "=3.27.0"
uuid = { version = "=1.29.0", features = ["v4", "serde"] }
duckdb = { version = "=1.20000.0", default-features = false, features = [
  "bundled",
  "chrono",
] }
libduckdb-sys = { version = "=1.20000.0", default-features = false, features = [
  "bundled",
] }
regex = "=1.13.1"
tokenizers = { version = "=0.23.2", default-features = false, features = [
  "fancy-regex",
] }
ctrlc = "=3.5.1"
cc = "=1.10.0"
hf-hub = { version = "=0.5.0", default-features = false, features = [
  "tokio",
  "rustls-tls",
] }
tokio = { version = "=1.54.1", default-features = false, features = [
  "rt",
  "time",
] }
rusqlite = { version = "=0.40.2", default-features = false, features = [
  "bundled",
  "hooks",
  "limits",
] }
llm-history-core = { path = "crates/core" }
llm-history-store = { path = "crates/store/history" }
llm-history-store-engine = { path = "crates/store/engine" }
llm-history-store-harnesses = { path = "crates/store/harnesses" }
llm-history-models = { path = "crates/models" }
llm-history-search = { path = "crates/search" }
llm-history-app = { path = "crates/app" }
llm-history-ingest = { path = "crates/ingest" }
llm-history-types = { path = "crates/types" }

# Avoid gigabytes of C++ debug symbols and DuckDB's debug-only verification paths,
# and optimize DuckDB so debug builds and tests run SQL at release speed. Keep debug
# information for our own Rust code. Tests inherit the dev profile.
[profile.dev.package.libduckdb-sys]
debug = false
opt-level = 3
